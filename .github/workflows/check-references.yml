name: Check reference links

# Reference points in dimensions/*.md cite OSS Rails projects + docs.
# Those URLs can rot. This workflow runs weekly (and on demand) to
# HEAD-check each reference URL and open/update a tracking issue
# when any return non-2xx.

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: read
  issues: write

jobs:
  check-references:
    name: HEAD-check reference URLs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract reference URLs
        id: extract
        run: |
          # Collect URLs that appear inside `## Reference points` sections
          # of any dimensions/*.md file. Outputs urls.txt with one URL per line.
          mkdir -p tmp
          ruby -e '
            urls = []
            Dir.glob("skills/rails-audit/dimensions/*.md").each do |path|
              in_section = false
              File.foreach(path) do |line|
                if line =~ /^##\s+Reference points/
                  in_section = true
                  next
                end
                if in_section && line =~ /^##\s/
                  in_section = false
                end
                next unless in_section
                # Match Markdown links: [text](url)
                line.scan(/\[[^\]]+\]\((https?:\/\/[^)]+)\)/) do |m|
                  urls << m.first
                end
              end
            end
            File.write("tmp/urls.txt", urls.uniq.sort.join("\n"))
            puts "Extracted #{urls.uniq.size} unique URLs"
          '
          cat tmp/urls.txt

      - name: HEAD-check each URL
        id: check
        run: |
          # Returns lines of the form: STATUS<TAB>URL
          mkdir -p tmp
          : > tmp/results.txt
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            status=$(curl -ksLI -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
            printf "%s\t%s\n" "$status" "$url" >> tmp/results.txt
          done < tmp/urls.txt
          echo "Checked $(wc -l < tmp/results.txt) URLs"
          echo "Failures (non-2xx, non-3xx):"
          awk -F'\t' '$1 !~ /^[23]/' tmp/results.txt | tee tmp/failures.txt

      - name: Open or update tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s tmp/failures.txt ]; then
            echo "All URLs healthy. No issue to open."
            exit 0
          fi

          # Find existing issue with the [link-rot] label
          existing=$(gh issue list --label "link-rot" --state open --limit 1 --json number --jq '.[0].number' || echo "")

          body=$(cat <<MARKDOWN
          ## Rotted reference URLs detected

          The weekly link-rot check found URLs in \`dimensions/*.md\` returning non-2xx/3xx responses.

          | Status | URL |
          |---|---|
          $(awk -F'\t' '{ print "| " $1 " | " $2 " |" }' tmp/failures.txt)

          ### What to do

          1. For each URL, check whether the upstream project moved (rename, GitHub redirect chain) or was deleted.
          2. If the upstream is still alive at a different URL: update \`dimensions/*.md\` to the new path.
          3. If the upstream is gone: replace with a comparable alternative or remove the reference.

          Generated by \`.github/workflows/check-references.yml\`.
          MARKDOWN
          )

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "Updated existing issue #$existing"
          else
            gh issue create \
              --title "Rotted reference URLs ($(wc -l < tmp/failures.txt) found)" \
              --label "link-rot" \
              --body "$body"
          fi
